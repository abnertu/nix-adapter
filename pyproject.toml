[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nix_adapter"
version = "0.5.0"
description = "Cross-platform native reconciliation adapter and CLI primitives for Nix deployments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich",
]

[project.scripts]
progress-renderer = "nix_adapter.progress:main"

[project.urls]
Source = "https://github.com/gin31259461/nix-adapter"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
# The library is strict; tests drive it through fakes and stay standard.
strict = ["src"]
useLibraryCodeForTypes = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length.
ignore = ["E501"]
