[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nix_adapter"
version = "0.7.0"
description = "Cross-platform native reconciliation adapter and CLI primitives for Nix deployments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich",
]

[project.urls]
Source = "https://github.com/abnertu/nix-adapter"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
# The library is strict; tests drive it through fakes and stay standard.
strict = ["src"]
useLibraryCodeForTypes = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "C901", "PLR0911", "PLR0912", "PLR0915",
    # Public modules, classes, methods and functions carry a docstring.
    "D100", "D101", "D102", "D103", "D104", "D106",
]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test names state the behavior they guard.
"tests/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 10
